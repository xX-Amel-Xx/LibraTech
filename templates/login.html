<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Biblioteca - Login</title>
</head>
<body>

      <!-- BARRA SUPERIOR -->
    <header class="topo">
        <div class="Bib">
            <img class="img_livro"
                 src="{{ url_for('static', filename='img/livro.png') }}"
                 alt="Logo LibraTech">
            <h4 class="biblioteca">LibraTech</h4>
        </div>
    </header>


    <!-- CONTAINER CENTRAL DE LOGIN -->
    <div class="container-login">
        <div class="card-login">

            <!-- ILUSTRAÇÃO DO TOPO DO CARD -->
            <div class="circulo-ilustracao">
                <img class="imagem-login" src="/static/img/img log.png" alt="Ilustração Livros">
            </div>

            <!-- TÍTULO E SUBTÍTULO -->
            <h2>Biblioteca</h2>
            <p class="subtitulo">Faça login para acessar o sistema</p>

            <!-- FORMULÁRIO DE LOGIN -->
            <form action="/login" method="POST" class="form-login">

                <!-- CAMPO USUÁRIO -->
                <div class="campo-input">
                    <i class="bi bi-person icon-input"></i>
                    <input type="text" name="email" placeholder="Usuário" required>
                </div>

                <!-- CAMPO SENHA -->
              <div class="campo-input">
    <i class="bi bi-lock icon-input"></i>
    <input type="password" name="senha" id="senha" placeholder="Senha" required>
    <i class="bi bi-eye-slash icon-olho" id="toggleSenha"></i>
</div>

                <!-- MENSAGENS DE ERRO -->
                <div class="mensagens_erro">
                    {% with mensagens = get_flashed_messages(with_categories=true) %}
                        {% for categoria, mensagem in mensagens %}
                            <p class="msg-flash {{ categoria }}">{{ mensagem }}</p>
                        {% endfor %}
                    {% endwith %}
                </div>

                <!-- BOTÃO ENTRAR -->
                <button type="submit" class="btn-entrar">Entrar</button>

                <!-- LINK ESQUECEU A SENHA -->
                <a href="{{ url_for('recuperar_senha') }}" class="link-esqueceu">Esqueceu a senha?</a>

                <!-- cadastrar usuario-->
                <a href="{{ url_for('tela_cadastrar') }}" class="link-cadastro">Não possui cadastro?</a>

            </form>

        </div>
    </div>
<script>
    const toggleSenha = document.querySelector('#toggleSenha');
    const campoSenha = document.querySelector('#senha');

    toggleSenha.addEventListener('click', function () {
        // Alterna entre 'password' e 'text'
        const tipo = campoSenha.getAttribute('type') === 'password' ? 'text' : 'password';
        campoSenha.setAttribute('type', tipo);
        
        // Alterna o ícone do olho (aberto / fechado)
        this.classList.toggle('bi-eye');
        this.classList.toggle('bi-eye-slash');
    });
</script>
</body>
</html>

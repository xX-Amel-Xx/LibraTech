<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/disponiveis.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Livros disponíveis</title>
</head>

<body>
    <!-- BARRA SUPERIOR -->
    <div class="topo">
        <div class="Bib">
            <img class="img_livro" src="/static/img/livro.png" alt="Logo Libratech">
            <h4 class="biblioteca">LibraTech</h4>
        </div>
    </div>

    <!-- BOTÃO VOLTAR -->
    <div class="area-voltar">
        <a href="/inicial" class="botao-voltar2">
            <button class="btn-voltar" type="button">
                <i class="bi bi-arrow-left-square-fill"></i>
                Voltar
            </button>
        </a>
    </div>

    <!-- CABEÇALHO DA PÁGINA -->
    <div class="cabeçalho-disponiveis">
        <!-- ÍCONE DE LIVRO -->
        <div class="circulo-livro">
            <img class="livro" src="/static/img/icon-4.png" alt="Livro">
        </div>
        <div class="textos-cabeçalho">
            <h1>Livros disponíveis</h1>
            <h5>Confira os livros disponíveis</h5>
        </div>
    </div>

    <!-- FORMULÁRIO DE FILTRO EM CARD -->
    <div class="card-filtro">
        <form action="/li_disponiveis" method="POST" class="form-grid">

            <div class="grupo-campo campo-pesquisa">
                <label>Pesquisar por título, autor ou editora</label>
                <div class="input-com-icone">
                    <i class="bi bi-search"></i>
                    <input type="text" name="pesquisa" placeholder="Digite o título, autor ou editora">
                </div>
            </div>

            <div class="grupo-campo">
                <label for="categoria">Categoria</label>
                <select name="categoria_id" id="categoria">
                    <option value="">Todas as categorias</option>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}">
                            {{ categoria.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grupo-campo">
                <label for="autor">Autor</label>
                <select name="autor" id="autor">
                    <option value="">Todos os autores</option>
                    {% for autores in autor_livro %}
                        <option value="{{ autores.autor }}">
                            {{ autores.autor }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grupo-campo">
                <label for="editora">Editora</label>
                <select name="editora" id="editora">
                    <option value="">Todas as editoras</option>
                    {% for editoras in editora_livro %}
                        <option value="{{ editoras.editora }}">
                            {{ editoras.editora }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grupo-btn">
                <button type="submit" class="btn-filtrar">
                    <i class="bi bi-funnel"></i> Filtrar
                </button>
            </div>

        </form>
    </div>

    <!-- LISTAGEM DE LIVROS -->
    <div class="card-tabela">
        <!-- CABEÇALHO DA TABELA -->
        <div class="tabela-header">
            <span style="width: 65px; flex-shrink: 0;">CAPA</span>
            <span class="col-titulo">TÍTULO</span>
            <span class="col-autor">AUTOR</span>
            <span class="col-categoria">CATEGORIA</span>
            <span class="col-editora">EDITORA</span>
            <span class="col-status">STATUS</span>
        </div>

        <!-- LINHAS DOS LIVROS -->
        <div class="Informacoes">
            {% for livro in livros %}
                <div class="livro">
                    <!-- ÍCONE DE LIVRO DA LISTA -->
                    <div class="circulo-livro">
                        <img class="livro" src="/static/img/icon-1.png" alt="Livro">
                    </div>

                    <div class="col-titulo">
                        <h3>{{ livro.titulo }}</h3>
                    </div>

                    <div class="col-autor">
                        <p>{{ livro.autor }}</p>
                    </div>

                    <div class="col-categoria">
                        <span class="badge-categoria">{{ livro.categoria.nome }}</span>
                    </div>

                    <div class="col-editora">
                        <p>{{ livro.editora }}</p>
                    </div>

                    <div class="col-status">
                        <span class="status-tag no-prazo">Disponível</span>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

</body>

</html>

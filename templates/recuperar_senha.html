<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar_senha.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Recuperar senha - LibraTech</title>
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="topo">
        <div class="Bib">
            <img class="img_livro"
                 src="{{ url_for('static', filename='img/livro.png') }}"
                 alt="Logo LibraTech">
            <h4 class="biblioteca">LibraTech</h4>
        </div>
    </header>

    <!-- BOTÃO VOLTAR -->
    <div class="area-voltar">
        <a href="/login" class="botao-voltar2">
            <button class="btn-voltar" type="button">
                <i class="bi bi-arrow-left-square-fill"></i>
                Voltar
            </button>
        </a>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container-recuperar">
        <div class="card-recuperar">
            
            <!-- ÍCONE DO LIVRO -->
            <div class="area-icone-livro">
                <img class="img-livro-card" src="{{ url_for('static', filename='img/livro.png') }}" alt="Ícone Livro">
            </div>

            <h3>Recuperar senha</h3>
            <p class="subtitulo">Digite o e-mail cadastrado para continuar.</p>

            <form method="POST" action="/recuperar_senha" class="form-recuperar">

                <div class="campo-input">
                    <i class="bi bi-envelope icon-input"></i>
                    <input
                        type="email"
                        name="email"
                        required
                        placeholder="E-mail"
                    >
                </div>

                <button type="submit" class="btn-continuar">
                    Continuar
                </button>

            </form>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <div class="link-voltar-login">
                <a href="{{ url_for('login') }}">
                    Voltar para o login
                </a>
            </div>

        </div>
    </main>

</body>

</html>

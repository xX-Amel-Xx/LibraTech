<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - LibraTech</title>
</head>

<body>

    <h3>Recuperar senha</h3>

    <p>Digite o e-mail cadastrado para continuar.</p>

    <form method="POST" action="/recuperar_senha">

        <input
            type="email"
            name="email"
            required
            placeholder="E-mail"
        >

        <button type="submit">
            Continuar
        </button>

    </form>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <a href="{{ url_for('login') }}">
        Voltar para o login
    </a>

</body>

</html>

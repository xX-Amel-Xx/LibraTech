<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Biblioteca - Login</title>
</head>
<body>

    <!-- BARRA SUPERIOR (NAVBAR) -->
    <div class="topo">
        <div class="Bib">
            <i class="bi bi-book-half logo-icon"></i>
            <h4 class="biblioteca">Biblioteca</h4>
        </div>
        <div class="usuario-topo">
            <i class="bi bi-person-fill"></i>
            <span>Entrar</span>
        </div>
    </div>

    <!-- CONTAINER CENTRAL DE LOGIN -->
    <div class="container-login">
        <div class="card-login">

            <!-- ILUSTRAÇÃO DO TOPO DO CARD -->
            <div class="circulo-ilustracao">
                <img src="/static/img/icon-1.png" alt="Ilustração Livros">
            </div>

            <!-- TÍTULO E SUBTÍTULO -->
            <h2>Biblioteca</h2>
            <p class="subtitulo">Faça login para acessar o sistema</p>

            <!-- FORMULÁRIO DE LOGIN -->
            <form action="/login" method="POST" class="form-login">

                <!-- CAMPO USUÁRIO -->
                <div class="campo-input">
                    <i class="bi bi-person icon-input"></i>
                    <input type="text" name="usuario" placeholder="Usuário" required>
                </div>

                <!-- CAMPO SENHA -->
                <div class="campo-input">
                    <i class="bi bi-lock icon-input"></i>
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>

                <!-- BOTÃO ENTRAR -->
                <button type="submit" class="btn-entrar">Entrar</button>

                <!-- LINK ESQUECEU A SENHA -->
                <div class="link-esqueceu">
                    <a href="#">Esqueceu sua senha?</a>
                </div>

            </form>

        </div>
    </div>

</body>
</html>

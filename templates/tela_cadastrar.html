<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tela_cadastrar.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>LibraTech cadastro</title>
</head>
<body>

    <!-- BARRA SUPERIOR  -->
    <div class="topo">
        <div class="Bib">
            <img class="img_livro" src="/static/img/livro.png" alt="Logo Libratech">
            <h4 class="biblioteca">LibraTech</h4>
        </div>
    </div>

    <!-- BOTÃO VOLTAR -->
    <div class="area-voltar">
        <a href="/inicial" class="botao-voltar2">
            <button class="btn-voltar" type="button">
                <i class="bi bi-arrow-left-square-fill"></i>
                Voltar
            </button>
        </a>
    </div>

    <!-- CONTAINER CENTRAL DE CADASTRO -->
    <div class="container-cadastro">
        <div class="card-cadastro">

            <!-- ILUSTRAÇÃO DO TOPO DO CARD -->
            <div class="circulo-ilustracao">
                <img class="imagem-login" src="/static/img/img log.png" alt="Ilustração Livros">
            </div>
            
            <h3 class="cadastrar">Cadastre-se</h3>

            <form class="cadastro-form" method="POST" action="/tela_cadastrar">
                
                <div class="campo-input">
                    <i class="bi bi-person icon-input"></i>
                    <input type="text" name="nome" required placeholder="Nome completo">
                </div>
                
                <div class="campo-input">
                    <i class="bi bi-envelope icon-input"></i>
                    <input type="email" name="email" required placeholder="E-mail">
                </div>

                <div class="campo-input">
                    <i class="bi bi-lock icon-input"></i>
                    <input type="password" name="senha" id="senha" required placeholder="Senha">
                    <i class="bi bi-eye-slash icon-olho" id="toggleSenha"></i>
                </div>

                <div class="campo-input">
                    <i class="bi bi-lock-fill icon-input"></i>
                    <input type="password" name="confirmar_senha" id="confirmar_senha" required placeholder="Confirmar senha">
                    <i class="bi bi-eye-slash icon-olho" id="toggleConfirmarSenha"></i>
                </div>
                
                <div class="campo-input">
                    <i class="bi bi-telephone icon-input"></i>
                    <input type="tel" name="telefone" required placeholder="Telefone">
                </div>
     <!-- MENSAGENS DE ERRO / FLASH -->
                <div class="mensagens_erro">
                    {% with mensagens = get_flashed_messages(with_categories=true) %}
                        {% for categoria, mensagem in mensagens %}
                            <p class="msg-flash {{ categoria }}">{{ mensagem }}</p>
                        {% endfor %}
                    {% endwith %}
                </div>
                <button type="submit" class="btn-cadastro">Cadastrar</button>

            </form>

            <div class="cadastro-voltar">
                <a href="{{ url_for('login') }}" class="link-login">
                    Voltar para o login
                </a>
            </div>

        </div>
    </div>

<script>
    // Toggle Senha
    const toggleSenha = document.querySelector('#toggleSenha');
    const campoSenha = document.querySelector('#senha');

    toggleSenha.addEventListener('click', function () {
        const tipo = campoSenha.getAttribute('type') === 'password' ? 'text' : 'password';
        campoSenha.setAttribute('type', tipo);
        this.classList.toggle('bi-eye');
        this.classList.toggle('bi-eye-slash');
    });

    // Toggle Confirmar Senha
    const toggleConfirmarSenha = document.querySelector('#toggleConfirmarSenha');
    const campoConfirmarSenha = document.querySelector('#confirmar_senha');

    toggleConfirmarSenha.addEventListener('click', function () {
        const tipo = campoConfirmarSenha.getAttribute('type') === 'password' ? 'text' : 'password';
        campoConfirmarSenha.setAttribute('type', tipo);
        this.classList.toggle('bi-eye');
        this.classList.toggle('bi-eye-slash');
    });
</script>

</body>
</html>
